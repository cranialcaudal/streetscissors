<!doctype html>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #1e272e } canvas { display: block }</style>
<canvas id="c"></canvas>
<script type="module">
  import * as F from "./figure3d.js"
  const canvas = document.getElementById("c")
  let draw = null, prep = null, bg = [0.118, 0.153, 0.180]
  // The ground the figure is filmed on: the panel it will be shown in.
  window.F3D = {
    load(track, muscles, height, ground) {
      if (ground) bg = ground
      prep = F.prepare(track, muscles)
      canvas.height = height
      canvas.width = Math.round((height * prep.cam.aspect) / 4) * 4
      draw = F.renderer(canvas)
      return { w: canvas.width, h: canvas.height, frames: prep.frames.length }
    },
    png(i) {
      const f = prep.frames[i]
      draw(prep.cam, f.shapes, f.things, bg, f.bound)
      return canvas.toDataURL("image/png")
    },
  }
  window.F3D.ready = true
</script>
